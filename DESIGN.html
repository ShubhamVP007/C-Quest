<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        text-align: center;
        margin-top: 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        width: 100%;
        border-radius: 10px;
        justify-content: center;
    }
    .container{
        background-color: #e6e2c4ff;
        padding: 20px;
        width: 400px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.8);
    }
    .container:hover {
        transform: translateY(-3px);
    }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #Result {
            margin-top: 22px;
            padding:16px;
            background-color: white;
            border-radius: 10px;
        }
        input {
            width: 250px;
            padding: 10px;
            border-radius: 6px;
            border: black;
            font-size: 16px;
        }
        #Calculate {
  display: inline-block;
  padding: 12px 24px;
  background-color: #4a4a4a;
  color: white;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
}

#Calculate:hover {
  background-color: #6b6b6b;
  transform: translateY(-3px);
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
}

#Calculate:active {
  transform: translateY(0);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
}

</style>
<body>
    <div class="container">
        <h1>Student Marks</h1>
        <input id="Name" type="text" placeholder="Enter Name"> <br><br>
        <input id="C-Marks" type="number" placeholder="Enter C Marks"> <br><br>
        <input id="Maths-Marks" type="number" placeholder="Enter Maths Marks"> <br><br>
        <input id="Physics-Marks" type="number" placeholder="Enter Physics Marks"> <br><br>
        <button id="Calculate">Calculate</button>
        <div id="Result"></div>
    </div>
    <script>
        let button = document.getElementById("Calculate");
        button.addEventListener("click", function() {
            let c = document.getElementById("C-Marks").value;
            let maths = document.getElementById("Maths-Marks").value;
            let physics = document.getElementById("Physics-Marks").value;

            c = Number(c);
            maths = Number(maths);
            physics = Number(physics);

            let total = c + maths + physics;
            let percentage = (total / 300) * 100;

            let result = document.getElementById("Result");

            let grade;
            if(percentage >= 90) {
                grade="O-Grade";
            } else if(percentage >= 80 && percentage < 90) {
                grade="A-Grade";
            } else if(percentage >= 75 && percentage < 80) {
                grade="B-Grade";
            } else if(percentage >= 70 && percentage < 75) {
                grade="C-Grade";
            } else if(percentage >= 50 && percentage < 70) {
                grade="D-Grade";
            } else {
                grade="F-Grade";
            }
            const name = document.getElementById("Name").value;
result.innerHTML = `Name: ${name}<br>Total: ${total}<br>Percentage: ${percentage.toFixed(2)}%<br>Grade: ${grade}`;

        });
        </script>
        
</body>
</html>
